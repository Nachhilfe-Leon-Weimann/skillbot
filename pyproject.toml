[project]
name = "skillbot"
version = "0.1.0"
description = "A Discord bot for tutoring management and automation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "skillcore>=0.2.0",
    "discord-py>=2.6.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "skillforge-client>=0.3.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8", "ty>=0.0.82"]

[build-system]
requires      = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
skillcore = { git = "https://github.com/Nachhilfe-Leon-Weimann/skillcore.git", tag = "v0.2.0" }

[tool.ruff]
target-version = "py313"
line-length    = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes (real bugs like unused variables)
    "W",  # pycodestyle warnings
    "B",  # flake8-bugbear (common footguns)
    "I",  # import sorting (isort)
    "UP", # pyupgrade (modernize syntax for the target Python version)
]

ignore = [
    # "E501", # line length
]

fixable = ["ALL"]

unfixable = [
    "F401", # unused imports
]

[tool.ruff.format]
preview = true

[tool.ty.terminal]
error-on-warning = true
